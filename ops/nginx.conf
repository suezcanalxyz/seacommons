# SeaCommons API — nginx reverse proxy
# Install to: /etc/nginx/sites-available/seacommons
# Enable:     sudo ln -s /etc/nginx/sites-available/seacommons /etc/nginx/sites-enabled/
# Test:       sudo nginx -t
# Reload:     sudo systemctl reload nginx

server {
    listen 80;
    server_name 204.216.210.155 api.seacommons.suezcanal.xyz;

    # Security headers
    add_header X-Frame-Options DENY;
    add_header X-Content-Type-Options nosniff;
    add_header Referrer-Policy strict-origin-when-cross-origin;

    # Vercel proxy sends requests from its own IP — allow all; CORS is handled
    # by FastAPI middleware for direct-browser requests (local dev).

    # Proxy all traffic to uvicorn on localhost
    location / {
        proxy_pass         http://127.0.0.1:8000;
        proxy_http_version 1.1;

        # Required for WebSocket upgrades (ws://)
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts — drift computation can take up to 3 minutes
        proxy_read_timeout    300s;
        proxy_send_timeout    300s;
        proxy_connect_timeout  10s;

        # Buffering — disable for streaming / SSE responses
        proxy_buffering off;

        client_max_body_size 10m;
    }

    # Health check — fast path, no logging
    location = /health {
        proxy_pass http://127.0.0.1:8000/health;
        access_log off;
    }

    # Block direct access to internal paths
    location ~ ^/(core|\.env|\.git) {
        return 404;
    }

    access_log /var/log/nginx/seacommons-access.log;
    error_log  /var/log/nginx/seacommons-error.log  warn;
}
