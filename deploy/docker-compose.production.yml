name: seacommons

services:
  proxy:
    image: caddy:2-alpine
    ports: ["80:80", "443:443"]
    environment:
      PUBLIC_DOMAIN: ${PUBLIC_DOMAIN:-seacommons.org}
      WWW_DOMAIN: ${WWW_DOMAIN:-www.seacommons.org}
      LEGACY_DOMAIN: ${LEGACY_DOMAIN:-seacommons.suezcanal.xyz}
      SEACOMMONS_DOMAIN: ${SEACOMMONS_DOMAIN:-console.seacommons.org}
      DEMO_DOMAIN: ${DEMO_DOMAIN:-demo.seacommons.org}
      DEMO_API_DOMAIN: ${DEMO_API_DOMAIN:-demo-api.seacommons.org}
      API_DOMAIN: ${API_DOMAIN:-api.seacommons.org}
      AUTH_DOMAIN: ${AUTH_DOMAIN:-auth.seacommons.org}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on: [site, dashboard, demo-dashboard, api, demo-api, keycloak]
    restart: unless-stopped

  site:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.site
    restart: unless-stopped

  dashboard:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.frontend
      args:
        VITE_API_BASE: https://${API_DOMAIN:-api.seacommons.org}
        VITE_PUBLIC_BASE: /
        VITE_AUTH_ENABLED: "true"
        VITE_OIDC_AUTHORITY: https://${AUTH_DOMAIN:-auth.seacommons.org}/realms/seacommons
        VITE_OIDC_CLIENT_ID: seacommons-console
        VITE_APP_PROFILE: live
    restart: unless-stopped

  demo-dashboard:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.frontend
      args:
        VITE_API_BASE: https://${DEMO_API_DOMAIN:-demo-api.seacommons.org}
        VITE_PUBLIC_BASE: /
        VITE_AUTH_ENABLED: "false"
        VITE_APP_PROFILE: demo
    restart: unless-stopped

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile.api
    environment:
      RUNTIME_PROFILE: production
      AUTH_ENABLED: "true"
      OIDC_ISSUER: https://${AUTH_DOMAIN:-auth.seacommons.org}/realms/seacommons
      OIDC_AUDIENCE: seacommons-api
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-seacommons}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-seacommons}
      REDIS_URL: redis://valkey:6379/0
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_WHATSAPP_NUMBER: ${TWILIO_WHATSAPP_NUMBER:-}
      TWILIO_OPERATIONS_WHATSAPP_TO: ${TWILIO_OPERATIONS_WHATSAPP_TO:-}
      PARTNER_WEBHOOK_SECRET: ${PARTNER_WEBHOOK_SECRET:-}
      OBJECT_STORAGE_ENDPOINT: minio:9000
      OBJECT_STORAGE_ACCESS_KEY: ${MINIO_ROOT_USER:-seacommons}
      OBJECT_STORAGE_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}
      OBJECT_STORAGE_BUCKET: seacommons
      OBJECT_STORAGE_SECURE: "false"
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_OPERATIONS_CHAT_ID: ${TELEGRAM_OPERATIONS_CHAT_ID:-}
      PUBLIC_API_URL: https://${API_DOMAIN:-api.seacommons.org}
      JOB_EXECUTION_MODE: queue
      SUEZCANAL_SIGNING_KEY: ${SUEZCANAL_SIGNING_KEY:?set SUEZCANAL_SIGNING_KEY}
      ALLOWED_ORIGINS: https://${SEACOMMONS_DOMAIN:-console.seacommons.org}
    depends_on:
      postgres: { condition: service_healthy }
      valkey: { condition: service_healthy }
      keycloak: { condition: service_started }
      minio: { condition: service_started }
    restart: unless-stopped

  demo-api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile.api
    environment:
      RUNTIME_PROFILE: demo
      DEMO_PUBLIC_MODE: "true"
      AUTH_ENABLED: "false"
      DATABASE_URL: sqlite:////data/seacommons-demo.db
      REDIS_URL: ""
      JOB_EXECUTION_MODE: inline
      INTEL_ENABLED: "false"
      GNSS_ENABLED: "false"
      INFRASOUND_ENABLED: "false"
      SEISMIC_ENABLED: "false"
      SUEZCANAL_SIGNING_KEY: ${DEMO_SIGNING_KEY:?set DEMO_SIGNING_KEY}
      ALLOWED_ORIGINS: https://${DEMO_DOMAIN:-demo.seacommons.org}
    volumes: [demo_data:/data]
    restart: unless-stopped

  worker:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile.api
    command: python -m core.worker
    environment:
      RUNTIME_PROFILE: production
      JOB_EXECUTION_MODE: queue
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-seacommons}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-seacommons}
      REDIS_URL: redis://valkey:6379/0
      OBJECT_STORAGE_ENDPOINT: minio:9000
      OBJECT_STORAGE_ACCESS_KEY: ${MINIO_ROOT_USER:-seacommons}
      OBJECT_STORAGE_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}
      OBJECT_STORAGE_BUCKET: seacommons
      OPENDRIFT_PYTHON: ${OPENDRIFT_PYTHON:-}
      CMEMS_USERNAME: ${CMEMS_USERNAME:-}
      CMEMS_PASSWORD: ${CMEMS_PASSWORD:-}
      SUEZCANAL_SIGNING_KEY: ${SUEZCANAL_SIGNING_KEY:?set SUEZCANAL_SIGNING_KEY}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_OPERATIONS_CHAT_ID: ${TELEGRAM_OPERATIONS_CHAT_ID:-}
    depends_on:
      postgres: { condition: service_healthy }
      valkey: { condition: service_healthy }
      minio: { condition: service_started }
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "from core.db.session import engine; c=engine().connect(); c.close()"]
      interval: 30s
      timeout: 10s
      retries: 3

  postgres:
    image: postgis/postgis:16-3.4-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-seacommons}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-seacommons}
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"], interval: 10s, timeout: 5s, retries: 10 }
    restart: unless-stopped

  keycloak-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?set KEYCLOAK_DB_PASSWORD}
      POSTGRES_DB: keycloak
    volumes: [keycloak_data:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U keycloak"], interval: 10s, timeout: 5s, retries: 10 }
    restart: unless-stopped

  keycloak:
    image: quay.io/keycloak/keycloak:26.2
    command: start --import-realm --proxy-headers=xforwarded --http-enabled=true --hostname=https://${AUTH_DOMAIN:-auth.seacommons.org}
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?set KEYCLOAK_DB_PASSWORD}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?set KEYCLOAK_ADMIN_PASSWORD}
    volumes:
      - ../ops/keycloak/realm-seacommons.json:/opt/keycloak/data/import/realm-seacommons.json:ro
      - ../ops/keycloak/themes/seacommons:/opt/keycloak/themes/seacommons:ro
    depends_on: { keycloak-db: { condition: service_healthy } }
    restart: unless-stopped

  valkey:
    image: valkey/valkey:8-alpine
    command: valkey-server --save 60 1 --appendonly yes
    volumes: [valkey_data:/data]
    healthcheck: { test: ["CMD", "valkey-cli", "ping"], interval: 10s, timeout: 3s, retries: 10 }
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-seacommons}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}
    volumes: [object_data:/data]
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.4.1
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=15d"]
    volumes:
      - ../ops/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    depends_on: [api]
    restart: unless-stopped

  grafana:
    image: grafana/grafana-oss:12.0.2
    ports: ["127.0.0.1:3001:3000"]
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ../ops/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../ops/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on: [prometheus]
    restart: unless-stopped

volumes:
  caddy_data:
  postgres_data:
  keycloak_data:
  valkey_data:
  object_data:
  prometheus_data:
  grafana_data:
  demo_data:
