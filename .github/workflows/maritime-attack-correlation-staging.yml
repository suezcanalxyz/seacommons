  push:
    branches:
      - feature/maritime-attack-correlation-20261030
    paths:
      - apps/api/core/intel/maritime_attack_correlation.py
      - apps/api/core/intel/maritime_attack_ais_context_readonly.py
      - apps/api/core/intel/maritime_attack_identity_evidence.py
      - apps/api/core/intel/maritime_attack_operator_statement.py
      - apps/api/core/intel/maritime_attack_relay_lineage.py
      - tests/test_maritime_attack_operator_statement.py
      - tests/test_maritime_attack_relay_lineage.py
      - tests/test_maritime_attack_lineage_scaling.py
      - tests/test_maritime_attack_identity_evidence.py
      - tests/test_maritime_attack_ais_context_readonly.py
      - apps/api/core/intel/maritime_attack_origin_review.py
      - tests/test_maritime_attack_origin_review.py
      - apps/api/core/intel/maritime_attack_staging_lifecycle.py
      - tests/test_maritime_attack_staging_lifecycle.py
      - apps/api/core/intel/maritime_attack_staging_manifest.py
      - apps/api/core/intel/maritime_attack_staging_preview.py
      - tests/test_maritime_attack_staging_preview.py
      - apps/api/core/intel/maritime_attack_staging_ais_context.py
      - tests/test_maritime_attack_staging_ais_context.py
      - apps/api/core/intel/maritime_attack_staging_case_review.py
      - apps/api/core/intel/maritime_attack_staging_lineage.py
      - apps/api/core/intel/maritime_attack_staging_store.py
      - tests/test_maritime_attack_staging_lineage.py
      - tests/test_maritime_attack_staging_store.py
      - docs/research/maritime-attack-mscio-146-2026-11-02.json
      - tests/test_maritime_attack_staging_case_review.py
      - docs/research/maritime-attack-transport-rescue-2026-11-02.json
      - docs/research/maritime-attack-able-damage-assessment-2026-11-02.json
      - apps/api/core/intel/maritime_attack_navwarn_dtg.py
      - tests/test_maritime_attack_navwarn_dtg.py
      - docs/research/maritime-attack-varna-navwarn-768-2026-11-02.json
      - docs/research/maritime-attack-source-check-2026-11-01.json
      - docs/research/maritime-attack-mscio-163-2026-11-02.json
      - docs/research/maritime-attack-mscio-164-2026-11-02.json
      - tests/test_maritime_attack_staging_manifest.py
      - apps/api/core/intel/official_maritime_bulletin.py
      - tests/test_official_maritime_bulletin.py
      - tests/test_official_maritime_bulletin_sqlite.py
      - tests/test_official_maritime_bulletin_postgres.py
      - apps/api/core/intel/maritime_attack_lineage_readonly.py
      - apps/api/core/intel/maritime_attack_observation_readonly.py
      - apps/api/core/intel/maritime_attack_outcomes.py
      - apps/api/core/intel/maritime_attack_episode_readonly.py
      - apps/api/core/intel/maritime_attack_play_guard.py
      - apps/api/core/intel/maritime_attack_independence_readonly.py
      - apps/api/core/intel/maritime_attack_batch_readonly.py
      - apps/api/core/api/routes/play.py
      - apps/api/core/domain/incident_taxonomy.py
      - apps/api/core/domain/visual_category.py
      - apps/web/src/features/intel/categories.js
      - apps/web/src/main.jsx
      - tests/test_maritime_attack_visual_taxonomy.py
      - apps/web/src/features/intel/categories.attack.test.js
      - tests/test_maritime_attack_correlation.py
      - tests/test_maritime_attack_ais_receipt_guard.py
      - tests/test_maritime_attack_lineage_readonly.py
      - tests/test_maritime_attack_observation_readonly.py
      - tests/test_maritime_attack_outcomes.py
      - tests/test_maritime_attack_episode_readonly.py
      - tests/test_maritime_attack_play_guard.py
      - tests/test_maritime_attack_independence_readonly.py
      - tests/test_maritime_attack_batch_readonly.py
      - tests/test_maritime_attack_postgres_audit_sql.py
      - docs/research/maritime-attack-postgres-readonly-audit-2026-10-31.sql
      - .github/workflows/maritime-attack-correlation-staging.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  correlation-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install isolated SQLAlchemy test dependency
        run: python -m pip install 'SQLAlchemy>=2.0,<2.1'
      - name: Unit tests (pure, no production credentials)
        env:
          PYTHONPATH: apps/api
        run: |
          python -m unittest discover -s tests -p 'test_maritime_attack*.py' -v
          python -m unittest discover -s tests -p 'test_official_maritime_bulletin.py' -v

  frontend-attack-taxonomy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install frontend dependencies (staging only)
        run: npm ci --prefix apps/web
      - name: Verify attack colors, false positives and humanitarian isolation
        run: node --test apps/web/src/features/intel/categories.attack.test.js
      - name: Build frontend without deploying
        run: npm run build --prefix apps/web

  bulletin-writer-sqlite:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install isolated SQLite test dependency only
        run: python -m pip install 'SQLAlchemy>=2.0,<2.1'
      - name: Canonical writer replay and rollback, no production credentials
        env:
          PYTHONPATH: apps/api
        run: python -m unittest discover -s tests -p 'test_official_maritime_bulletin_sqlite.py' -v

  bulletin-writer-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: seacommons_attack_test
          POSTGRES_USER: sc_test
          POSTGRES_PASSWORD: sc_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sc_test -d seacommons_attack_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install isolated PostgreSQL test dependencies
        run: python -m pip install 'SQLAlchemy>=2.0,<2.1' 'psycopg[binary]>=3.2,<4'
      - name: PostgreSQL canonical writer, provenance, idempotency and rollback
        env:
          PYTHONPATH: apps/api
          SC_ATTACK_TEST_PG_URL: postgresql+psycopg://sc_test:sc_test@127.0.0.1:5432/seacommons_attack_test
        run: python -m unittest discover -s tests -p 'test_official_maritime_bulletin_postgres.py' -v
