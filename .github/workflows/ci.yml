name: Full CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e "apps/api[dev]"
      - run: python -m pytest -q
      # Baseline debt (ruff ~125 minimal-ruleset findings, mypy ~176 errors) predates this
      # gate and isn't fixed here — see docs/ENGINEERING_AUDIT.md. Report-only until a
      # follow-up PR triages the backlog and flips these to blocking.
      - name: ruff (report-only)
        run: python -m ruff check . --output-format=github
        working-directory: apps/api
        continue-on-error: true
      - name: mypy (report-only)
        run: python -m mypy core
        working-directory: apps/api
        continue-on-error: true
      - name: pip-audit (report-only)
        run: python -m pip-audit --strict
        working-directory: apps/api
        continue-on-error: true

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run test:simulation
      - run: npm run build
      # dompurify/nanoid/postcss vulns are transitive-only (cesium/vite pin them);
      # fix requires a dependency bump, tracked separately. Report-only until then.
      - name: npm audit (report-only)
        run: npm audit --omit=dev
        continue-on-error: true

  edge:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/edge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/edge/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm audit --omit=dev
