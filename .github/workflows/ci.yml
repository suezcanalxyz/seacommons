name: Full CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e "apps/api[dev]"
      - run: python -m pytest -q
      - name: ruff critical correctness gate
        run: python -m ruff check . --output-format=github
        working-directory: apps/api
      - name: ruff full baseline (report-only)
        run: python -m ruff check . --select E4,E7,E9,F --output-format=github
        working-directory: apps/api
        continue-on-error: true
      - name: mypy canonical Live domain gate
        run: >-
          python -m mypy
          core/domain/live_contracts.py
          core/live/projection.py
          core/intel/public_policy.py
          core/intel/public_geometry.py
          --follow-imports=skip
        working-directory: apps/api
      - name: mypy full baseline (report-only)
        run: python -m mypy core
        working-directory: apps/api
        continue-on-error: true
      - name: audit declared Python project dependencies
        run: python -m pip_audit . --strict
        working-directory: apps/api

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - name: ESLint full baseline (report-only)
        run: npm run lint:js:full
        continue-on-error: true
      - run: npm test
      - run: npm run build
      - name: audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  edge:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/edge
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/edge/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npx wrangler deploy --dry-run
      - run: npm audit --omit=dev --audit-level=high

  repository:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: reject whitespace errors in the committed change
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE: ${{ github.event.before }}
        run: |
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            base="$PR_BASE"
          else
            base="$PUSH_BASE"
          fi
          if ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            base="HEAD^"
          fi
          git diff --check "$base" HEAD
      - name: scan committed history for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
