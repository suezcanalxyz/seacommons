name: Full CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e "apps/api[dev]"
      - run: python -m pytest -q
      - name: ruff critical correctness gate
        run: python -m ruff check . --output-format=github
        working-directory: apps/api
      - name: ruff full baseline (report-only)
        run: python -m ruff check . --select E4,E7,E9,F --output-format=github
        working-directory: apps/api
        continue-on-error: true
      - name: mypy canonical Live domain gate
        run: >-
          python -m mypy
          core/domain/live_contracts.py
          core/live/projection.py
          core/intel/public_policy.py
          core/intel/public_geometry.py
          --follow-imports=skip
        working-directory: apps/api
      - name: mypy full baseline (report-only)
        run: python -m mypy core
        working-directory: apps/api
        continue-on-error: true
      - name: audit declared Python project dependencies
        run: python -m pip_audit . --strict
        working-directory: apps/api

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run test:simulation
      - run: npm run build
      - name: audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  edge:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/edge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/edge/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm audit --omit=dev --audit-level=high
