name: AIS Sources

on:
  pull_request:
    paths:
      - "apps/api/core/vessels/aishub.py"
      - "apps/api/core/vessels/aisstream.py"
      - "apps/api/core/bootstrap.py"
      - "tests/test_aishub.py"
      - ".github/workflows/ais-sources.yml"
  push:
    branches: [main]
    paths:
      - "apps/api/core/vessels/aishub.py"
      - "apps/api/core/vessels/aisstream.py"
      - "apps/api/core/bootstrap.py"
      - "tests/test_aishub.py"
      - ".github/workflows/ais-sources.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install "httpx>=0.27" "pytest>=8"
      - run: python -m pytest -q tests/test_aishub.py
        env:
          PYTHONPATH: apps/api
